spring:
  application:
    name: medistock-backend-test
  datasource:
    url: jdbc:h2:mem:medistock_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test_jwt_secret_key_for_testing_purposes_only_which_is_long_enough_1234567890
  expiration: 86400000
  refresh-expiration: 604800000

ml:
  service:
    url: http://localhost:8000

