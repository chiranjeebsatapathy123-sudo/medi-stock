spring:
  application:
    name: medistock-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medistock}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:very_secret_default_key_for_development_purposes_only_which_needs_to_be_long_enough}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000} # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
